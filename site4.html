<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vazados</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.65),
          rgba(0, 0, 0, 0.75)
        ),
        url("Vazados.png");

      background-size: cover;
      background-position: center;

      color: white;
    }

    .card {
      width: 100%;
      max-width: 420px;

      padding: 35px 25px;

      text-align: center;

      background: rgba(20, 20, 20, 0.82);

      border-radius: 22px;

      backdrop-filter: blur(8px);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45);
    }

    .icone {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;

      font-size: 30px;
    }

    p {
      margin-top: 12px;

      color: #ccc;

      line-height: 1.5;
    }

    button {
      width: 100%;

      margin-top: 25px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #ffffff;

      color: #111;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 15px;

      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icone">
      📸
    </div>

    <h1>
      Vazados
    </h1>

    <p>
      Conteúdos e informações
      que despertam curiosidade.
    </p>

    <button id="participar">
      ACESSAR
    </button>

    <div id="status"></div>

  </div>


  <!-- 🔥 LÓGICA DO SITE 4 -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getMessaging,
      getToken
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // 🔥 MESMO FIREBASE DO LINKPUSH

    const firebaseConfig = {
      apiKey: "AIzaSyBxt1S0Rn63tymkSa0CqqpQBi8fFgSKhoE",
      authDomain: "linkpush-e7bb6.firebaseapp.com",
      projectId: "linkpush-e7bb6",
      storageBucket: "linkpush-e7bb6.firebasestorage.app",
      messagingSenderId: "753138864517",
      appId: "1:753138864517:web:3df918ac7b3a861bdff4ec"
    };


    // 🔥 INICIA O FIREBASE DO SITE 4
    // Nome separado para não entrar em conflito
    // com o app.js do Site 2.

    const appSite4 =
      initializeApp(firebaseConfig, "Site4");

    const messaging =
      getMessaging(appSite4);

    const db =
      getFirestore(appSite4);


    // 🔘 ELEMENTOS

    const botao =
      document.getElementById("participar");

    const status =
      document.getElementById("status");


    // 🔘 BOTÃO ACESSAR

    botao.addEventListener("click", async () => {

      try {

        status.textContent =
          "Preparando cadastro...";


        // 🔔 VERIFICA NOTIFICAÇÕES

        if (!("Notification" in window)) {

          status.textContent =
            "Seu navegador não suporta notificações.";

          return;
        }


        // 🔔 PEDE PERMISSÃO

        const permissao =
          await Notification.requestPermission();


        if (permissao !== "granted") {

          status.textContent =
            "Permissão para notificações não concedida.";

          return;
        }


        // ⚙️ VERIFICA SERVICE WORKER

        if (!("serviceWorker" in navigator)) {

          status.textContent =
            "Seu navegador não suporta Service Worker.";

          return;
        }


        // 📡 REGISTRA O SERVICE WORKER

        const registro =
          await navigator.serviceWorker.register(
            "./firebase-messaging-sw.js"
          );


        // 🔥 PEGA TOKEN FCM

        const token =
          await getToken(messaging, {
            serviceWorkerRegistration: registro
          });


        if (!token) {

          status.textContent =
            "Não foi possível obter o token.";

          return;
        }


        console.log(
          "FCM Token Site 4:",
          token
        );


        // 💾 SALVA NO MESMO FIRESTORE

        await setDoc(
          doc(db, "usuarios", token),
          {
            token: token,
            nome: "Usuário",
            site: "Vazados",
            criadoEm: serverTimestamp()
          },
          {
            merge: true
          }
        );


        // 💾 MARCA COMO CADASTRADO

        localStorage.setItem(
          "linkpush_cadastrado",
          "sim"
        );


        // ✅ FINALIZADO

        status.textContent =
          "Cadastro concluído! 🔥✅";


      } catch (erro) {

        console.error(
          "Erro no cadastro do Site 4:",
          erro
        );

        status.textContent =
          "Erro ao realizar o cadastro ❌";

      }

    });

  </script>

</body>

</html>
