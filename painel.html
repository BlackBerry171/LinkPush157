<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkPush — Painel</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 25px 18px; font-family: Arial, sans-serif; background: #111; color: white; }
        .topo { margin-bottom: 25px; }
        .topo h1 { margin: 0; font-size: 30px; }
        .topo p { color: #aaa; margin-top: 8px; }
        .card { background: #1c1c1c; border-radius: 18px; padding: 20px; margin-bottom: 18px; }
        .numero { font-size: 36px; font-weight: bold; color: #ffd000; }
        .titulo { font-size: 17px; color: #ccc; margin-bottom: 12px; }
        .usuario { background: #292929; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .usuario strong { font-size: 16px; }
        .usuario small { display: block; margin-top: 5px; color: #999; }
        #status { color: #aaa; text-align: center; margin-top: 20px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: #292929; color: white; font-size: 15px; margin-bottom: 12px;
        }
        input::placeholder { color: #777; }
        #btnEnviar {
            width: 100%; padding: 16px; background: #ffd000; color: #111;
            border: none; border-radius: 12px; font-weight: bold; font-size: 17px;
            cursor: pointer; transition: transform 0.1s;
        }
        #btnEnviar:active { transform: scale(0.97); }
        #statusEnvio { margin-top: 12px; text-align: center; font-size: 14px; color: #aaa; }
        .sucesso { color: #70c98b !important; }
        .erro { color: #ff6b6b !important; }
        small.dica { color: #888; display: block; margin-top: -8px; margin-bottom: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="topo">
        <h1>📊 LinkPush</h1>
        <p>Painel de controle</p>
    </div>

    <!-- CARD: ENVIO MANUAL (SEM BLAZE) -->
    <div class="card">
        <div class="titulo">📨 Enviar Notificação Agora (Manual - Direto)</div>
        
        <input type="password" id="serverKey" placeholder="🔑 Cole a SERVER KEY do Firebase aqui">
        <small class="dica">(Console -> Cloud Messaging -> Server Key)</small>
        
        <input type="text" id="msgTexto" placeholder="🗯 Digite a mensagem (ex: Olá, confira!)">
        <input type="text" id="msgLink" placeholder="📎 Digite o link (ex: https://google.com)">
        
        <button id="btnEnviar">🚀 ENVIAR PARA TODOS AGORA</button>
        <div id="statusEnvio"></div>
    </div>

    <!-- CARD: USUÁRIOS -->
    <div class="card">
        <div class="titulo">👥 Usuários cadastrados</div>
        <div class="numero" id="total">0</div>
    </div>
    <div class="card">
        <div class="titulo">Lista de usuários</div>
        <div id="usuarios">Carregando...</div>
    </div>
    <div id="status"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxt1S0Rn63tymkSa0CqqpQBi8fFgSKhoE",
            authDomain: "linkpush-e7bb6.firebaseapp.com",
            projectId: "linkpush-e7bb6",
            storageBucket: "linkpush-e7bb6.firebasestorage.app",
            messagingSenderId: "753138864517",
            appId: "1:753138864517:web:3df918ac7b3a861bdff4ec"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variáveis globais
        let tokensList = [];

        const lista = document.getElementById("usuarios");
        const total = document.getElementById("total");
        const status = document.getElementById("status");

        // 👥 Carrega usuários em tempo real e guarda os tokens
        onSnapshot(
            collection(db, "usuarios"),
            (consulta) => {
                total.textContent = consulta.size;
                lista.innerHTML = "";
                tokensList = []; // Limpa a lista de tokens

                if (consulta.empty) {
                    lista.innerHTML = "<p>Nenhum usuário cadastrado.</p>";
                    status.textContent = "Firebase conectado ✅";
                    return;
                }

                let numero = 1;
                consulta.forEach((documento) => {
                    const dados = documento.data();
                    const nome = dados.nome || "Usuário";
                    const token = documento.id; // O ID do documento É o token
                    
                    // Adiciona o token na lista global
                    if (token) tokensList.push(token);

                    const div = document.createElement("div");
                    div.className = "usuario";
                    div.innerHTML = `
                        <strong>${String(numero).padStart(3, "0")} — ${nome}</strong>
                        <small>ID: ${token.substring(0, 20)}...</small>
                    `;
                    lista.appendChild(div);
                    numero++;
                });
                status.textContent = `Firebase conectado ✅ (${tokensList.length} tokens carregados)`;
            },
            (erro) => {
                console.error("Erro Firebase:", erro);
                status.textContent = "Erro ao carregar usuários ❌";
                lista.innerHTML = "<p>Não foi possível carregar os usuários.</p>";
            }
        );

        // 📨 BOTÃO ENVIAR USANDO A API LEGACY DO FCM (NÃO PRECISA DE BLAZE)
        const btnEnviar = document.getElementById("btnEnviar");
        const statusEnvio = document.getElementById("statusEnvio");
        const msgTexto = document.getElementById("msgTexto");
        const msgLink = document.getElementById("msgLink");
        const serverKeyInput = document.getElementById("serverKey");

      btnEnviar.addEventListener("click", async () => {
    const serverKey = serverKeyInput.value.trim();
    if (!serverKey) {
        statusEnvio.className = "erro";
        statusEnvio.textContent = "❌ Cole a SERVER KEY no campo acima!";
        return;
    }
    if (tokensList.length === 0) {
        statusEnvio.className = "erro";
        statusEnvio.textContent = "❌ Nenhum usuário cadastrado para enviar.";
        return;
    }

    const mensagem = msgTexto.value.trim() || "Clique para ver a novidade!";
    const link = msgLink.value.trim() || "https://blackberry171.github.io/LinkPush157/";

    statusEnvio.className = "";
    statusEnvio.textContent = `⏳ Enviando para ${tokensList.length} dispositivos...`;
    btnEnviar.disabled = true;
    btnEnviar.style.opacity = 0.6;

    try {
        // 🌐 COLE A SUA URL DO WEB PREVIEW AQUI (com /send no final)
        const proxyURL = 'https://8080-cs-e76b7763-1c5b-47a5-9a89-0a7c250780ed.cs-us-east1-pkhd.cloudshell.dev/?authuser=9/send';

        const response = await fetch(proxyURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ serverKey, tokens: tokensList, mensagem, link })
        });

        const data = await response.json();

        if (data.success || data.failure === 0) {
            statusEnvio.className = "sucesso";
            statusEnvio.textContent = `✅ Sucesso! Enviado para ${data.success} dispositivos.`;
        } else {
            statusEnvio.className = "erro";
            statusEnvio.textContent = `❌ Erro: ${data.error || data.results?.[0]?.error || 'Falha no envio'}`;
        }
        console.log('Resposta do proxy:', data);

    } catch (erro) {
        statusEnvio.className = "erro";
        statusEnvio.textContent = `❌ Erro de rede: ${erro.message}`;
    }

    btnEnviar.disabled = false;
    btnEnviar.style.opacity = 1;
});
        });
    </script>
</body>
</html>
