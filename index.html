<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Política</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background-image: url("Política.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
        }

        .card {
            width: 90%;
            max-width: 400px;

            padding: 35px 25px;

            text-align: center;

            background: rgba(255,255,255,0.92);

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0 0 15px;

            font-size: 28px;
            color: #222;
        }

        .descricao {
            margin: 0 0 30px;

            font-size: 16px;
            line-height: 1.5;

            color: #555;
        }

        #acessar {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 12px;

            background: #70c98b;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        #acessar:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🇧🇷 Central Política</h1>

        <p class="descricao">
            Informação, acontecimentos e bastidores.
        </p>

        <button id="acessar">
            ACESSAR
        </button>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
