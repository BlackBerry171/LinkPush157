<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participar</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .box {
            width: 85%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>👋 Bem-vindo!</h1>

        <p>
            Quer participar?
        </p>

        <button id="participar">
            OK
        </button>

        <p id="status"></p>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
