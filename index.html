<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Política</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* FUNDO */
        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
        }

        /* Imagem política desfocada */
        body::before {
            content: "";
            position: fixed;
            inset: -25px;

            background-image: url("./Política.png");
            background-size: cover;
            background-position: center;

            filter: blur(7px);
            transform: scale(1.08);

            z-index: -2;
        }

        /* Camada escura para melhorar a leitura */
        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.35);

            z-index: -1;
        }

        /* CARTÃO CENTRAL */
        .card {
            width: 86%;
            max-width: 390px;

            padding: 32px 25px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.5s ease;
        }

        .titulo {
            margin: 0 0 14px;

            font-size: 28px;
            font-weight: 800;

            color: #222;
        }

        .descricao {
            margin: 0 0 28px;

            font-size: 16px;
            line-height: 1.5;

            color: #555;
        }

        /* BOTÃO */
        #participar {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 12px;

            background: #168a45;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.20);

            transition: 0.2s;
        }

        #participar:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 18px;

            font-size: 14px;
            color: #555;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1 class="titulo">
            🇧🇷 Central Política
        </h1>

        <p class="descricao">
            Informação, acontecimentos e bastidores.
        </p>

        <button id="participar">
            ACESSAR
        </button>

        <p id="status"></p>

    </div>

    <!-- Mantém o sistema de cadastro que já construímos -->
    <script type="module" src="app.js"></script>

</body>
</html>
